<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<title>Painel Financeiro — Carlos</title>
<style>
  :root{
    --bg:#0c1116; --panel:#131a22; --panel2:#0f151c; --line:#212b35;
    --ink:#e9edf1; --sub:#8a97a3; --mut:#5c6773;
    --good:#3ecf8e; --warn:#f0b94d; --bad:#ef6461; --acc:#5aa9e6; --acc2:#c78ff0;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;padding:28px 18px 60px;}
  .wrap{max-width:1080px;margin:0 auto;}
  h1{font-size:22px;margin:0 0 2px;letter-spacing:.2px;}
  .period{color:var(--sub);font-size:13px;margin-bottom:0;}
  h2{font-size:14px;text-transform:uppercase;letter-spacing:1.2px;color:var(--sub);margin:38px 0 12px;display:flex;align-items:center;gap:8px;}
  h2 .n{width:20px;height:20px;border-radius:5px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--acc);}
  .grid{display:grid;gap:12px;}
  .g4{grid-template-columns:repeat(4,1fr);}
  .g3{grid-template-columns:repeat(3,1fr);}
  .g2{grid-template-columns:1.2fr 1fr;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
  .kpi .lbl{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;}
  .kpi .val{font-size:26px;font-weight:700;margin-top:6px;}
  .kpi .sub{font-size:12px;color:var(--mut);margin-top:4px;}
  .pos{color:var(--good);} .neg{color:var(--bad);} .warncol{color:var(--warn);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--sub);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px;padding:6px 10px;border-bottom:1px solid var(--line);}
  td{padding:9px 10px;border-bottom:1px solid var(--line);}
  tr:last-child td{border-bottom:none;}
  .right{text-align:right;font-variant-numeric:tabular-nums;}
  .donut{width:190px;height:190px;border-radius:50%;flex-shrink:0;}
  .legend{list-style:none;margin:0;padding:0;flex:1;}
  .legend li{font-size:13px;border-bottom:1px solid var(--line);}
  .legend li:last-child{border:none;}
  .dot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
  .legend .name{flex:1;}
  .legend .amt{font-variant-numeric:tabular-nums;color:var(--sub);font-size:12.5px;}
  .legend .pct{font-weight:700;width:46px;text-align:right;}
  .bar-outer{background:var(--panel2);border-radius:8px;height:14px;overflow:hidden;border:1px solid var(--line);}
  .bar-inner{height:100%;border-radius:8px;transition:width .25s ease;}
  .flexrow{display:flex;gap:22px;align-items:center;}
  .badge{display:inline-block;padding:4px 11px;border-radius:20px;font-size:12px;font-weight:700;}
  .badge.bad{background:rgba(239,100,97,.15);color:var(--bad);border:1px solid rgba(239,100,97,.35);}
  .badge.warn{background:rgba(240,185,77,.15);color:var(--warn);border:1px solid rgba(240,185,77,.35);}
  .badge.good{background:rgba(62,207,142,.15);color:var(--good);border:1px solid rgba(62,207,142,.35);}
  .tech{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;}
  .tech b{font-size:13px;} .tech p{margin:4px 0 0;font-size:12.5px;color:var(--sub);}
  .note{font-size:12px;color:var(--mut);margin-top:6px;}
  .split{display:flex;gap:12px;}
  .split>div{flex:1;}
  .progresslabel{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub);margin-bottom:6px;}
  .mini{font-size:11px;color:var(--mut);}
  .legend details{width:100%;}
  .legend summary{display:flex;align-items:center;gap:9px;cursor:pointer;list-style:none;padding:6px 0;}
  .legend summary::-webkit-details-marker{display:none;}
  .legend .chev{width:20px;height:20px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--acc);flex-shrink:0;transition:all .15s ease;}
  .legend summary:hover .chev{border-color:var(--acc);}
  .legend details[open] .chev{transform:rotate(90deg);background:var(--acc);color:var(--panel2);border-color:var(--acc);}
  .legend details[open] summary{padding-bottom:2px;}
  .subitems{list-style:none;margin:2px 0 10px;padding:0 0 0 19px;border-left:1px solid var(--line);}
  .subitems li{display:flex;justify-content:space-between;font-size:12.5px;padding:5px 0 5px 10px;color:var(--sub);border-bottom:none !important;}
  .subitems li b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;}
  .filterbar{display:flex;align-items:center;gap:10px;margin:14px 0 26px;flex-wrap:wrap;}
  .filterbar label{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;}
  .filterbar select{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;font-family:inherit;cursor:pointer;}
  .filterbar select:hover{border-color:var(--acc);}
  .filterbar .scopepill{font-size:11.5px;color:var(--acc);background:rgba(90,169,230,.12);border:1px solid rgba(90,169,230,.35);border-radius:20px;padding:4px 12px;}
  @media(max-width:760px){.g4{grid-template-columns:repeat(2,1fr);}.g3{grid-template-columns:1fr;}.g2{grid-template-columns:1fr;}.flexrow{flex-direction:column;}.donut{margin:0 auto;}}
</style>
</head>

};

  'Dívidas & crédito': '#ef6461',
  'Habitação': '#f0b94d',
  'Compras & lazer': '#c78ff0',
  'Transportes': '#5aa9e6',
  'Impulsos': '#e8895c',
  'Alimentação': '#3ecf8e',
  'Saúde, subscrições e seguros': '#8a97a3',
};
const CATEGORY_ORDER = ['Dívidas & crédito','Habitação','Compras & lazer','Impulsos','Transportes','Saúde, subscrições e seguros','Alimentação'];

const SUBCAT_KIND = {
  'Habitação': { '*': 'fixed' },
  'Dívidas & crédito': { '*': 'fixed' },
  'Transportes': {
    'Seguro automóvel (Mapfre)': 'fixed',
    'Combustível (Repsol)': 'essential',
    'Despesas com o automóvel': 'essential',
    'Portagens (Via Verde)': 'essential',
  },
  'Saúde, subscrições e seguros': {
    'Seguros': 'fixed', 'Subscrições': 'fixed', 'Comissões bancárias': 'fixed',
    'MBWay recorrente (por confirmar)': 'fixed',
    'Educação/formação': 'fixed', 'Farmácia & saúde': 'essential',
  },
  'Alimentação': { '*': 'essential' },
  'Compras & lazer': { '*': 'discretionary' },
  'Impulsos': { '*': 'discretionary' },
};
function kindOf(cat, sub) {
  const rules = SUBCAT_KIND[cat] || {};
  return rules[sub] || rules['*'] || 'discretionary';
}

function fmt(n) {
  return (Math.round(n * 100) / 100).toLocaleString('pt-PT', { minimumFractionDigits: 0, maximumFractionDigits: 0 }) + ' €';
}
function fmt2(n) {
  return (Math.round(n * 100) / 100).toLocaleString('pt-PT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
}
function pct(n) { return (Math.round(n * 10) / 10).toLocaleString('pt-PT', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%'; }

function emptyAgg() { return { income_salary: 0, income_other: 0, trade_republic: 0, expenses: {}, extraordinary: [], monthsCount: 0 }; }
function addMonth(agg, mk) {
  const m = MONTHLY[mk];
  if (!m) return;
  agg.income_salary += m.income_salary;
  agg.income_other += m.income_other;
  agg.trade_republic += m.trade_republic;
  agg.extraordinary = agg.extraordinary.concat(m.extraordinary);
  for (const [cat, subs] of Object.entries(m.expenses)) {
    agg.expenses[cat] = agg.expenses[cat] || {};
    for (const [sub, amt] of Object.entries(subs)) agg.expenses[cat][sub] = (agg.expenses[cat][sub] || 0) + amt;
  }
  agg.monthsCount += 1;
}
function totalExpenses(agg) {
  let t = 0;
  for (const subs of Object.values(agg.expenses)) for (const v of Object.values(subs)) t += v;
  return t;
}
function categoryTotals(agg) {
  const out = {};
  for (const [cat, subs] of Object.entries(agg.expenses)) out[cat] = Object.values(subs).reduce((a, b) => a + b, 0);
  return out;
}
function fixedEssentialTotal(agg) {
  let t = 0;
  for (const [cat, subs] of Object.entries(agg.expenses)) for (const [sub, amt] of Object.entries(subs)) {
    const k = kindOf(cat, sub);
    if (k === 'fixed' || k === 'essential') t += amt;
  }
  return t;
}
function subcatValue(agg, cat, sub) { return (agg.expenses[cat] && agg.expenses[cat][sub]) || 0; }
function discretionarySubcats(agg) {
  const list = [];
  for (const [cat, subs] of Object.entries(agg.expenses)) for (const [sub, amt] of Object.entries(subs)) {
    if (kindOf(cat, sub) === 'discretionary') list.push({ cat, sub, amt });
  }
  list.sort((a, b) => b.amt - a.amt);
  return list;
}

function computeView(filter) {
  const isAll = filter === 'all';
  const keys = isAll ? MONTH_ORDER : [filter];
  const agg = emptyAgg();
  keys.forEach(k => addMonth(agg, k));

  const avgKeys = isAll ? COMPLETE_MONTHS : keys;
  const avgAgg = emptyAgg();
  avgKeys.forEach(k => addMonth(avgAgg, k));
  const avgDivisor = avgKeys.length || 1;

  const income = agg.income_salary + agg.income_other;
  const expenses = totalExpenses(agg);
  const saldo = income - expenses - agg.trade_republic;

  const avgIncome = (avgAgg.income_salary + avgAgg.income_other) / avgDivisor;
  const avgExpenses = totalExpenses(avgAgg) / avgDivisor;
  const avgTR = avgAgg.trade_republic / avgDivisor;
  const avgSaldo = avgIncome - avgExpenses - avgTR;
  const avgSalary = avgAgg.income_salary / avgDivisor;
  const avgOther = avgAgg.income_other / avgDivisor;

  const catTotals = categoryTotals(agg);
  const catPct = {};
  for (const c of CATEGORY_ORDER) catPct[c] = expenses > 0 ? ((catTotals[c] || 0) / expenses * 100) : 0;

  const fixedEssential = fixedEssentialTotal(agg);
  const avgFixedEssential = fixedEssentialTotal(avgAgg) / avgDivisor;
  const variable = expenses - fixedEssential;
  const avgVariable = avgExpenses - avgFixedEssential;

  const topDiscretionary = discretionarySubcats(agg).slice(0, 3);
  const globalAvgSalary = (() => {
    const g = emptyAgg();
    COMPLETE_MONTHS.forEach(k => addMonth(g, k));
    return g.income_salary / COMPLETE_MONTHS.length;
  })();
  const valorHoraBase = avgSalary > 0 ? avgSalary : globalAvgSalary;
  const valorHora = valorHoraBase / 173;
  const valorHoraIsFallback = avgSalary <= 0;

  return {
    isAll, keys, filter,
    label: isAll ? `Todo o período (${PERIOD_LABEL})` : MONTH_LABELS[filter],
    monthsCount: keys.length, avgDivisor,
    income, expenses, saldo, trade_republic: agg.trade_republic,
    avgIncome, avgExpenses, avgSaldo, avgTR, avgSalary, avgOther,
    catTotals, catPct,
    fixedEssential, avgFixedEssential, variable, avgVariable,
    topDiscretionary, valorHora, valorHoraBase, valorHoraIsFallback,
    extraordinary: agg.extraordinary,
    expensesDetail: agg.expenses,
    agg,
  };
}

// ---------- Rendering ----------

function el(html) { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; }

function renderFilterOptions() {
  const sel = document.getElementById('monthFilter');
  sel.innerHTML = '';
  const optAll = document.createElement('option');
  optAll.value = 'all'; optAll.textContent = 'Todos os meses (período completo)';
  sel.appendChild(optAll);
  MONTH_ORDER.forEach(k => {
    const o = document.createElement('option');
    o.value = k; o.textContent = MONTH_LABELS[k];
    sel.appendChild(o);
  });
  sel.value = 'all';
}

function renderSection1(v) {
  document.getElementById('h2-1').textContent = v.isAll ? 'Visão geral (médias mensais)' : 'Visão geral (mês selecionado)';
  const entradas = v.isAll ? v.avgIncome : v.income;
  const salPart = v.isAll ? v.avgSalary : (MONTHLY[v.filter] ? MONTHLY[v.filter].income_salary : 0);
  const otherPart = v.isAll ? v.avgOther : (MONTHLY[v.filter] ? MONTHLY[v.filter].income_other : 0);
  const saidas = v.isAll ? v.avgExpenses : v.expenses;
  const fixedPart = v.isAll ? v.avgFixedEssential : v.fixedEssential;
  const varPart = saidas - fixedPart;
  const trRate = v.isAll ? v.avgTR : v.trade_republic;
  const saldo = v.isAll ? v.avgSaldo : v.saldo;

  document.getElementById('sec1').innerHTML = `
    <div class="card kpi"><div class="lbl">Entradas</div><div class="val pos">${fmt(entradas)}</div><div class="sub">salário ${fmt(salPart)} + outras ${fmt(otherPart)}</div></div>
    <div class="card kpi"><div class="lbl">Saídas correntes</div><div class="val neg">${fmt(saidas)}</div><div class="sub">fixas+essenciais ${fmt(fixedPart)} + variáveis ${fmt(varPart)}</div></div>
    <div class="card kpi"><div class="lbl">Fundo de emergência (Trade Republic)</div><div class="val" style="color:var(--acc)">${fmt(trRate)}${v.isAll ? '/mês' : ''}</div><div class="sub">≈${fmt(EMERGENCY_FUND_BALANCE)} acumulados, via J.P.Morgan AG</div></div>
    <div class="card kpi"><div class="lbl">Saldo líquido real</div><div class="val ${saldo >= 0 ? 'pos' : 'warncol'}">${saldo >= 0 ? '+' : ''}${fmt(saldo)}</div><div class="sub">${v.isAll ? 'saldo médio mensal real' : 'saldo real deste mês'}</div></div>
  `;
}

function renderDonutAndLegend(v) {
  const divisor = v.isAll ? v.avgDivisor : 1; // averages when scope spans multiple months, actuals for a single month
  const displayTotals = {};
  for (const c of CATEGORY_ORDER) displayTotals[c] = (v.catTotals[c] || 0) / divisor;

  const cats = CATEGORY_ORDER.filter(c => (v.catTotals[c] || 0) > 0);
  let acc = 0;
  const stops = [];
  cats.forEach(c => {
    const start = acc;
    acc += v.catPct[c];
    stops.push(`${CATEGORY_COLORS[c]} ${start.toFixed(2)}% ${acc.toFixed(2)}%`);
  });
  document.getElementById('donut').style.background = stops.length ? `conic-gradient(${stops.join(',')})` : 'var(--panel2)';

  const legend = document.getElementById('legend');
  legend.innerHTML = '';
  cats.slice().sort((a, b) => (v.catTotals[b] || 0) - (v.catTotals[a] || 0)).forEach(c => {
    const subs = v.expensesDetail[c] || {};
    const subItems = Object.entries(subs).sort((a, b) => b[1] - a[1])
      .map(([sub, amt]) => `<li><span>${sub}</span><b>${fmt(amt / divisor)}</b></li>`).join('');
    const li = document.createElement('li');
    li.innerHTML = `
      <details>
        <summary><span class="dot" style="background:${CATEGORY_COLORS[c]}"></span><span class="name">${c}</span><span class="amt">${fmt(displayTotals[c])}${v.isAll ? '/mês' : ''}</span><span class="pct">${pct(v.catPct[c])}</span><span class="chev">&#8250;</span></summary>
        <ul class="subitems">${subItems}</ul>
      </details>`;
    legend.appendChild(li);
  });
}

function renderSection3(v) {
  const income = v.isAll ? v.avgIncome : v.income;
  const expenses = v.isAll ? v.avgExpenses : v.expenses;
  const saldo = v.isAll ? v.avgSaldo : v.saldo;
  const teorica = income > 0 ? ((income - expenses) / income * 100) : 0;
  const real = income > 0 ? (saldo / income * 100) : 0;

    <div>
      <div class="progresslabel"><span>Teórica (rendimento − despesas)</span><span><b>${pct(teorica)}</b></span></div>
      <div class="bar-outer"><div class="bar-inner" style="width:${Math.max(0, Math.min(100, teorica))}%;background:var(--acc)"></div></div>
      <div class="mini">inclui a parte que vai para o Trade Republic e a parte não alocada</div>
    </div>
    <div>
      <div class="progresslabel"><span>Real (saldo que efetivamente sobra)</span><span><b class="${real >= 15 ? 'pos' : 'warncol'}">${pct(real)}</b></span></div>
      <div class="bar-outer"><div class="bar-inner" style="width:${Math.max(0, Math.min(100, real))}%;background:${real >= 15 ? 'var(--good)' : 'var(--warn)'}"></div></div>
      <div class="mini">${real < 5 ? 'a fatia "não alocada" está a evaporar em despesas' : 'boa margem retida neste período'}</div>
    </div>
    <div>
      <div class="progresslabel"><span>Objetivo saudável</span><span><b class="pos">20%</b></span></div>
      <div class="bar-outer"><div class="bar-inner" style="width:20%;background:var(--good)"></div></div>
      <div class="mini">referência geral de poupança</div>
    </div>
  `;
}

function renderSection4(v) {
  const d = v.avgDivisor;
  const isAllAvgBasis = v.isAll;
  const mbway = isAllAvgBasis ? (subcatValue(v.agg, 'Saúde, subscrições e seguros', 'MBWay recorrente (por confirmar)') / d) : subcatValue(v.agg, 'Saúde, subscrições e seguros', 'MBWay recorrente (por confirmar)');
  const subs = isAllAvgBasis ? (subcatValue(v.agg, 'Saúde, subscrições e seguros', 'Subscrições') / d) : subcatValue(v.agg, 'Saúde, subscrições e seguros', 'Subscrições');
  const comissoes = isAllAvgBasis ? (subcatValue(v.agg, 'Saúde, subscrições e seguros', 'Comissões bancárias') / d) : subcatValue(v.agg, 'Saúde, subscrições e seguros', 'Comissões bancárias');
  const rows = [
    ['Serviço recorrente MBWay "1600-404 Lisboa"', mbway, 'confirmar o que é'],
    ['Subscrições (Spotify, Patreon, Apple...)', subs, 'rever se todas usadas'],
    ['Comissões manutenção de conta', comissoes, 'mudar p/ conta isenta'],
  ];
  const total = rows.reduce((a, r) => a + r[1], 0);
  document.getElementById('sec4').innerHTML = `
    <tr><th>Origem</th><th class="right">${v.isAll ? 'Mensal (média)' : 'Neste mês'}</th><th class="right">Anual estimado</th><th>Ação</th></tr>
    ${rows.map(([name, val, action]) => `<tr><td>${name}</td><td class="right">${fmt2(val)}</td><td class="right">${fmt(val * 12)}</td><td class="${val > 30 ? 'warncol' : ''}">${action}</td></tr>`).join('')}
    <tr><td><b>Total identificado</b></td><td></td><td class="right"><b>${fmt(total * 12)}/ano</b></td><td></td></tr>
  `;
}

function renderSection5(v) {
  const valorHora = v.valorHora;
  const items = v.topDiscretionary;
  const cards = [`
    <div class="card kpi"><div class="lbl">Valor/hora líquido</div><div class="val" style="color:var(--acc)">${fmt2(valorHora)}</div><div class="sub">${fmt(v.valorHoraBase)} ÷ 173h${v.valorHoraIsFallback ? ' (média do período, sem salário este mês)' : ' (8h×5d)'}</div></div>
  `];
  items.forEach((it, i) => {
    const hours = valorHora > 0 ? it.amt / valorHora : 0;
    const days = hours / 8;
    cards.push(`
      <div class="card kpi"><div class="lbl">#${i + 1} ${it.sub}</div><div class="val neg">${fmt(it.amt)}</div><div class="sub">≈ ${Math.round(hours)}h · ${days.toFixed(1)} dias de trabalho${v.isAll ? '' : ' (neste mês)'}</div></div>
    `);
  });
  while (cards.length < 4) cards.push(`<div class="card kpi"></div>`);
  document.getElementById('sec5').innerHTML = cards.join('');
}

function renderSection6(v) {
  const monthlyBase = v.isAll ? v.avgFixedEssential : v.fixedEssential;
  const goal = monthlyBase * 6;
  const balance = EMERGENCY_FUND_BALANCE;
  const progressPct = goal > 0 ? Math.min(100, balance / goal * 100) : 0;
  const falta = Math.max(0, goal - balance);
  const trRate = v.isAll ? v.avgTR : v.trade_republic;
  const monthsToGoal = trRate > 0 ? (falta / trRate) : null;

  document.getElementById('sec6').innerHTML = `
    <div class="progresslabel"><span>${fmt(balance)} de ${fmt(goal)} (despesas fixas+essenciais × 6) — em Trade Republic</span><span><b>${pct(progressPct)}</b></span></div>
    <div class="bar-outer"><div class="bar-inner" style="width:${progressPct}%;background:var(--good)"></div></div>
    <div class="split" style="margin-top:14px;">
      <div class="card" style="background:var(--panel2)"><div class="lbl mini">Falta</div><div class="val" style="font-size:19px">${fmt(falta)}</div></div>
      <div class="card" style="background:var(--panel2)"><div class="lbl mini">Ao ritmo de contribuição ${v.isAll ? 'médio' : 'deste mês'} (${fmt2(trRate)}/mês)</div><div class="val ${monthsToGoal ? 'pos' : 'warncol'}" style="font-size:19px">${monthsToGoal ? '~' + monthsToGoal.toFixed(1) + ' meses' : 'sem contribuição'}</div></div>
      <div class="card" style="background:var(--panel2)"><div class="lbl mini">Saldo hoje nas contas do dia a dia</div><div class="val neg" style="font-size:19px">${fmt2(CURRENT_BALANCE_TODAY)}</div></div>
    </div>
    <div class="note">Saldo do Trade Republic reportado pelo utilizador (conta fora destes extratos). Contribuições identificadas nestes extratos: ago–nov/25 regulares, ${v.isAll ? 'praticamente paradas desde dez/25' : (trRate > 0 ? 'ativa neste mês' : 'sem transferência registada neste mês')}.</div>
  `;
}

function renderSection7(v) {
  const income = v.isAll ? v.avgIncome : v.income;
  const suggested = v.isAll ? (v.avgTR + Math.max(0, v.avgSaldo)) : (v.trade_republic + Math.max(0, v.saldo));
  const suggestedPct = income > 0 ? (suggested / income * 100) : 0;
  document.getElementById('sec7').innerHTML = `
    <div class="flexrow">
      <div class="kpi" style="flex:1"><div class="lbl">Transferir automaticamente no dia do salário</div><div class="val pos" style="font-size:32px">${pct(suggestedPct)}</div><div class="sub">≈ ${fmt(suggested)}${v.isAll ? '/mês' : ' neste mês'} do rendimento</div></div>
      <div style="flex:1.4;font-size:13px;color:var(--sub);">Uma única ordem automática no dia do salário para a Trade Republic (fundo de emergência), substituindo as transferências manuais atuais. Ao atingir o objetivo dos 6 meses de despesas, redirecionar esta mesma ordem para investimento.</div>
    </div>
  `;
}

function renderSection8(v) {
  const d = v.avgDivisor;
  const basis = v.isAll ? (x => x / d) : (x => x);
  const wizink = basis(subcatValue(v.agg, 'Dívidas & crédito', 'Wizink (empréstimo)'));
  const cartaoRevolving = basis(subcatValue(v.agg, 'Dívidas & crédito', 'Cartão crédito (revolving)'));
  const mbway = basis(subcatValue(v.agg, 'Saúde, subscrições e seguros', 'MBWay recorrente (por confirmar)'));
  const seguros = basis(subcatValue(v.agg, 'Saúde, subscrições e seguros', 'Seguros'));
  const comissoes = basis(subcatValue(v.agg, 'Saúde, subscrições e seguros', 'Comissões bancárias'));
  const rows = [
    ['Wizink + cartão crédito (revolving)', wizink + cartaoRevolving, (wizink + cartaoRevolving) * 12 * 0.4],
    ['Serviço recorrente MBWay "1600-404 Lisboa"', mbway, mbway * 12],
    ['Seguros diversos', seguros, seguros * 12 * 0.2],
    ['Comissões de manutenção de conta', comissoes, comissoes * 12],
  ].filter(r => r[1] > 0.01);
  const totalPot = rows.reduce((a, r) => a + r[2], 0);
  document.getElementById('sec8').innerHTML = `
    <tr><th>Conta</th><th class="right">Custo ${v.isAll ? 'médio/mês' : 'neste mês'}</th><th class="right">Poupança potencial/ano</th></tr>
    ${rows.map(([name, cost, pot]) => `<tr><td>${name}</td><td class="right">${fmt2(cost)}</td><td class="right pos">~${fmt(pot)}</td></tr>`).join('')}
    <tr><td><b>Total potencial</b></td><td></td><td class="right pos"><b>~${fmt(totalPot)}</b></td></tr>
  `;
}

function renderSection9(v) {
  const today = new Date(2026, 6, 21);
  const yearEnd = new Date(2026, 11, 31);
  const monthsLeft = (yearEnd - today) / (1000 * 60 * 60 * 24 * 30.44);
  const saldoRate = v.isAll ? v.avgSaldo : v.saldo;
  const projectedTheoretical = CURRENT_BALANCE_TODAY + saldoRate * monthsLeft;
  const impulsos = v.catTotals['Impulsos'] || 0;
  const impulsosPct = v.expenses > 0 ? impulsos / v.expenses * 100 : 0;
  let severity = 'LIGEIRA', badgeClass = 'good';
  if (impulsosPct > 25 || (v.topDiscretionary[0] && v.topDiscretionary[0].sub.includes('Apostas'))) { severity = 'MODERADA A GRAVE'; badgeClass = 'bad'; }
  else if (impulsosPct > 15) { severity = 'MODERADA'; badgeClass = 'warn'; }

  document.getElementById('sec9').innerHTML = `
    <div class="card">
      <div class="lbl mini">Projeção de saldo até 31/12/2026 (~${monthsLeft.toFixed(1)} meses restantes)</div>
      <div class="flexrow" style="margin-top:10px;">
        <div class="kpi"><div class="val" style="font-size:20px">${fmt2(CURRENT_BALANCE_TODAY)}</div><div class="sub">hoje</div></div>
        <div style="color:var(--mut);font-size:20px;">→</div>
        <div class="kpi"><div class="val ${projectedTheoretical >= CURRENT_BALANCE_TODAY ? 'pos' : 'warncol'}" style="font-size:20px">${projectedTheoretical >= 0 ? '+' : ''}${fmt(projectedTheoretical)}</div><div class="sub">${v.isAll ? 'ao ritmo médio real observado' : 'se este mês se repetir até dezembro'}</div></div>
      </div>
      <div class="note">Baseado no saldo real das contas do dia a dia hoje (Abanca+Revolut) e no saldo médio mensal ${v.isAll ? 'do período' : 'deste mês'}. Um imprevisto tipo o de ago/25 esvazia a conta de imediato — não há almofada nas contas correntes.</div>
    </div>
    <div class="card">
      <div class="lbl mini">Classificação do impulso ${v.isAll ? '' : '(mês selecionado)'}</div>
      <div style="margin:10px 0;"><span class="badge ${badgeClass}">${severity}</span></div>
      <div class="note" style="font-size:12.5px;">Impulsos representam ${pct(impulsosPct)} das despesas ${v.isAll ? 'do período' : 'deste mês'} (${fmt(impulsos)}), incluindo levantamentos ATM não rastreados e apostas.</div>
    </div>
  `;

  document.getElementById('sec9b').innerHTML = `
    <div class="lbl mini" style="margin-bottom:10px;">Técnicas mais indicadas ao teu caso</div>
    <div class="tech"><b>Contas separadas</b><p>Abanca/Revolut só para essenciais (renda, créditos, seguros) · Trade Republic só para o fundo de emergência, alimentado por uma ordem automática única · Interactive Brokers só para investir, depois de a reserva estar completa.</p></div>
    <div class="tech"><b>Remover cartões guardados</b><p>Apagar o cartão gravado no 22bet/Bet22 e em apps de compras impulsivas — cada aposta exige fricção extra, não um toque.</p></div>
    <div class="tech"><b>Regra das 72 horas</b><p>Para compras online acima de 30 € (roupa, tech, marketplaces): esperar 3 dias antes de confirmar.</p></div>
    <div class="tech"><b>Paga-te primeiro</b><p>Automatizar a transferência da secção 7 no dia do salário, para o dinheiro sair da equação antes de chegar ao Revolut.</p></div>
    <div class="tech" style="border-color:rgba(239,100,97,.35)"><b class="neg">Apoio profissional</b><p>Dado o padrão persistente e recorrente das apostas ao longo do período, vale a pena considerares falar com um profissional especializado em comportamento de jogo — não é um sinal de fraqueza, é a ferramenta certa para este tipo de padrão.</p></div>
  `;
}

function render(filter) {
  const v = computeView(filter);
  document.getElementById('scopePill').textContent = v.label;
  renderSection1(v);
  renderDonutAndLegend(v);
  renderSection3(v);
  renderSection4(v);
  renderSection5(v);
  renderSection6(v);
  renderSection7(v);
  renderSection8(v);
  renderSection9(v);
}

renderFilterOptions();
render('all');

</script>
